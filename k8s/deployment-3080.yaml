# 단일 RTX 3080(10GB) 노드에서 진짜 vLLM을 띄우는 매니페스트.
# deployment-gpu.yaml(클라우드 GPU 노드 풀 참고용)과의 차이:
#   1) 모델: Llama-3.1-8B(fp16 ~16GB, 3080에 안 들어감) -> TinyLlama-1.1B
#   2) nodeSelector/toleration 없음 — 노드가 하나뿐
#   3) 모델 캐시: PVC 대신 노드 hostPath (단일 노드라 공유 스토리지 불필요)
#   4) 롤링 업데이트 전략: Recreate (아래 설명)
#
# 전제: NVIDIA device plugin이 설치돼 노드가 nvidia.com/gpu: 1을 광고해야 함
#   kubectl describe node | grep nvidia.com/gpu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-3080
  labels:
    app: vllm-3080
spec:
  replicas: 1
  # GPU가 한 장이면 maxSurge=1 롤링 업데이트는 교착 상태가 된다:
  # 새 파드가 nvidia.com/gpu를 요청하지만 기존 파드가 GPU를 쥐고 있어 Pending,
  # maxUnavailable=0이라 기존 파드도 안 내려감. 다운타임을 감수하고 Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-3080
  template:
    metadata:
      labels:
        app: vllm-3080
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model=TinyLlama/TinyLlama-1.1B-Chat-v1.0"
            - "--max-model-len=2048"
            - "--gpu-memory-utilization=0.80"
            - "--enable-prefix-caching"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              memory: "12Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            # vLLM 워커 간 공유 메모리 (docker의 --ipc=host 대체)
            - name: dshm
              mountPath: /dev/shm
          # 첫 기동은 가중치 다운로드 + CUDA graph 캡처로 수 분 걸릴 수 있어서
          # liveness가 로딩 중인 파드를 죽이지 않도록 startupProbe로 분리
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: model-cache
          hostPath:
            path: /data/hf-cache
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-3080
spec:
  selector:
    app: vllm-3080
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
